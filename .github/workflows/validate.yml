name: Validate README

on:
  pull_request:
    paths: ["README.md", "scripts/**"]
  push:
    branches: [main]
    paths: ["README.md", "scripts/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check entry format, duplicates and anchors
        run: python3 scripts/validate_readme.py README.md
